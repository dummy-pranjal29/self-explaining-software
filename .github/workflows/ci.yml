name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Backend tests
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Run Django migrations
        run: |
          python manage.py migrate
        env:
          DJANGO_SETTINGS_MODULE: ses_core.settings

      - name: Run backend tests
        run: |
          pytest --cov=ses_intelligence --cov=ses_api --cov-report=xml
        env:
          DJANGO_SETTINGS_MODULE: ses_core.settings
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # Frontend tests
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ses-dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd ses-dashboard
          npm ci

      - name: Run frontend tests
        run: |
          cd ses-dashboard
          npm run test:run

  # Linting
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          pip install black flake8 isort

      - name: Run Black
        run: |
          black --check ses_intelligence/ ses_api/ ses_core/

      - name: Run isort
        run: |
          isort --check-only ses_intelligence/ ses_api/ ses_core/

      - name: Run flake8
        run: |
          flake8 ses_intelligence/ ses_api/ --max-line-length=100 --ignore=E501,W503

  # Type checking
  type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ses-dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd ses-dashboard
          npm ci

      - name: Run TypeScript check
        run: |
          cd ses-dashboard
          npx tsc --noEmit
