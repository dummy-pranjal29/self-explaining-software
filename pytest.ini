[pytest]
DJANGO_SETTINGS_MODULE = ses_core.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = ses_intelligence/tests ses_api/tests
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
